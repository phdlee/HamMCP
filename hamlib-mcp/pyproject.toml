[project]
name = "hamlib-mcp"
version = "0.1.0"
description = "MCP server for controlling amateur radios and wideband receivers via Hamlib"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8.0",
]

[project.scripts]
hamlib-mcp = "hamlib_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hamlib_mcp"]

[tool.uv]
package = true
